name: stage-tools

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'list | view | approve | reject | download'
        required: true
        default: list
      stage_id:
        description: 'stage id (for view/approve/reject/download)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use latest npm (staged publishing commands)
        run: npm install -g npm@latest
      - name: Run npm stage command
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          ACTION="${{ inputs.action }}"
          STAGE_ID="${{ inputs.stage_id }}"
          case "$ACTION" in
            list) npm stage list dsh-quality-lens --json ;;
            view) npm stage view "$STAGE_ID" --json ;;
            approve) npm stage approve "$STAGE_ID" ;;
            reject) npm stage reject "$STAGE_ID" ;;
            download) npm stage download "$STAGE_ID" ;;
            *) echo "unknown action: $ACTION"; exit 1 ;;
          esac
